    <!-- Description e canonical NAO ficam aqui de forma estatica: o
         react-helmet-async anexa as dele em vez de substituir, e duas tags em
         conflito fazem o Google descartar o sinal. Cada rota define as suas. -->
    
    <!-- Open Graph.
         As 4 tags abaixo levam data-rh="true" DE PROPOSITO. O react-helmet-async
         ANEXA suas tags em vez de substituir — exceto as que ja carregam esse
         atributo, que ele remove e repoe no mount. Sem isso ficavam duas
         og:description no head e o scraper (WhatsApp/Facebook) lia a primeira,
         a estatica, matando a versao especifica de cada rota.
         Continuam estaticas porque crawler social NAO executa JS: enquanto uma
         rota nao estiver prerenderizada, estas sao as unicas que ele enxerga.
         So podem levar data-rh tags que TODA rota redeclara — se o helmet
         apagar uma que ninguem repoe, ela some da pagina renderizada.
         og:image e twitter:* ficam sem o atributo: nem toda rota os declara. -->
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:title" content="Dr. Juliano Machado – Oftalmologista em Paragominas e Belém" data-rh="true" />
